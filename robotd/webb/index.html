<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robotstyrning</title>
<style>
  :root { color-scheme: dark; --red: #ff4a3d; --green: #3ecf7a; --yellow: #f2c25a; --panel: rgba(0,0,0,.62); }
  html, body { margin: 0; height: 100%; background: #000; color: #e6ece9;
    font: 15px/1.35 -apple-system, system-ui, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #bild { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #yta { position: fixed; inset: 0; touch-action: none; }
  #status { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
    background: var(--panel); border-radius: 10px; padding: 5px 9px; font-size: 13px;
    font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 2px 10px;
    max-width: calc(100% - 230px); pointer-events: none; }
  #status b { font-weight: 600; }
  #knappar { position: fixed; right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top));
    display: grid; grid-template-columns: auto auto; gap: 8px; z-index: 2; }
  #knappar button { padding: 12px 14px; }
  #knappar #vand { grid-column: 1 / span 2; }
  #installningar { position: fixed; right: max(8px, env(safe-area-inset-right)); top: calc(max(8px, env(safe-area-inset-top)) + 112px);
    background: rgba(20,24,23,.92); border-radius: 14px; padding: 10px; display: none; flex-direction: column;
    gap: 8px; width: 190px; z-index: 3; }
  #installningar.oppen { display: flex; }
  button { font: 600 15px/1 -apple-system, system-ui, sans-serif; color: #fff; border: 0; border-radius: 12px;
    padding: 12px 10px; background: rgba(40,48,46,.85); touch-action: manipulation; }
  button:active { filter: brightness(1.3); }
  #aktivera { font-size: 17px; background: #2b6b4f; min-width: 120px; }
  #kugg { font-size: 20px; }
  #aktivera.pa { background: var(--red); }
  #aktivera:disabled { background: #444; color: #999; }
  #ljus.pa { background: #b08a1e; }
  #vand { background: #3a4a70; }
  #vand.pa { background: #6a85d8; }
  .rad { display: flex; gap: 8px; }
  .rad button { flex: 1; padding: 12px 0; font-size: 20px; }
  #maxtxt { flex: 1.4; display: flex; align-items: center; justify-content: center; background: var(--panel);
    border-radius: 12px; font-variant-numeric: tabular-nums; font-weight: 600; }
  #meddelande { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
    background: var(--panel); border-radius: 12px; padding: 14px 18px; font-size: 17px; max-width: 80%;
    pointer-events: none; }
  #meddelande:empty { display: none; }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--yellow); }
</style>
</head>
<body>
<canvas id="bild"></canvas>
<canvas id="yta"></canvas>
<div id="status"></div>
<div id="knappar">
  <button id="aktivera">AKTIVERA</button>
  <button id="kugg" aria-label="Inställningar">⚙</button>
  <button id="vand">VÄND (håll in)</button>
</div>
<div id="installningar">
  <button id="ljus">Ljus</button>
  <div class="rad"><button id="maxned">−</button><div id="maxtxt"></div><button id="maxupp">+</button></div>
</div>
<div id="meddelande">Ansluter…</div>
<script>
"use strict";
// Robotstyrning i telefon/iPad (robotd webb.rs), 2026-10-20.
// Vänster halva: fart (upp/ner), fjädrar tillbaka till 0 när tummen släpper.
// Höger halva: styrning (åt sidorna). Samma kommandon som Robotstyrning.

// ---------- Inställningar ----------
const SEND_MS = 50;                 // styrkommandon 20 ggr/s (robotd stannar om de uteblir)
const STICK_R = 70;                 // joystickens radie i px
const DEADZONE = 0.08;
const IDLE_MS = 5 * 60 * 1000;      // AKTIVERA släpps efter 5 min utan tryck, som Robotstyrning
const MAX_DEFAULT = 0.30, MAX_MIN = 0.05, MAX_STEG = 0.05;
// Färdlinjer: samma värden som client/src/guide.rs
const WHEELBASE_M = 1.2, TRACK_M = 1.3, MAX_STEER_DEG = 30, STRAIGHT_PERCENT = 9, STRAIGHT_DEG = 2.7;
const PATH_LEN_M = 4.0, HORIZON = 0.42, CAM_HEIGHT = 1.0, SPREAD_PX = 60;

const $ = (id) => document.getElementById(id);
const bild = $("bild"), bctx = bild.getContext("2d");
const yta = $("yta"), yctx = yta.getContext("2d");
const meddelande = $("meddelande");

// ---------- Tillstånd ----------
const s = {
  driver: false, aktiv: false, ljus: false, pivot: false,
  max: (() => { try { const v = parseFloat(localStorage.getItem("max")); return isFinite(v) ? clampMax(v) : MAX_DEFAULT; } catch (_) { return MAX_DEFAULT; } })(),
  gas: 0, styr: 0, status: null, statusAt: 0, rtt: null, senastTryck: Date.now(), fps: 0,
};
function clampMax(v) { return Math.min(1, Math.max(MAX_MIN, Math.round(v * 100) / 100)); }
function visa(t) { meddelande.textContent = t || ""; }

// ---------- Joystickar (flera fingrar via Pointer Events) ----------
const sticks = new Map(); // pointerId -> { sida, x0, y0, x, y }
function storlek() {
  const dpr = window.devicePixelRatio || 1;
  yta.width = innerWidth * dpr; yta.height = innerHeight * dpr;
  yctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", storlek); storlek();

function axel(v) { // -1..1 med dödband
  const a = Math.max(-1, Math.min(1, v));
  return Math.abs(a) < DEADZONE ? 0 : (a - Math.sign(a) * DEADZONE) / (1 - DEADZONE);
}
function uppdateraSpakar() {
  s.gas = 0; s.styr = 0;
  for (const p of sticks.values()) {
    if (p.sida === "v") s.gas = axel(-(p.y - p.y0) / STICK_R);
    else s.styr = axel((p.x - p.x0) / STICK_R);
  }
}
yta.addEventListener("pointerdown", (e) => {
  $("installningar").classList.remove("oppen");
  const sida = e.clientX < innerWidth / 2 ? "v" : "h";
  for (const p of sticks.values()) if (p.sida === sida) return; // en tumme per sida
  yta.setPointerCapture(e.pointerId);
  sticks.set(e.pointerId, { sida, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY });
  s.senastTryck = Date.now(); keepAwake();
});
yta.addEventListener("pointermove", (e) => {
  const p = sticks.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY; uppdateraSpakar();
});
function slapp(e) { if (sticks.delete(e.pointerId)) uppdateraSpakar(); }
yta.addEventListener("pointerup", slapp);
yta.addEventListener("pointercancel", slapp);
yta.addEventListener("lostpointercapture", slapp);

function ritaSpakar() {
  yctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of sticks.values()) {
    const dx = p.sida === "h" ? Math.max(-STICK_R, Math.min(STICK_R, p.x - p.x0)) : 0;
    const dy = p.sida === "v" ? Math.max(-STICK_R, Math.min(STICK_R, p.y - p.y0)) : 0;
    yctx.lineWidth = 3; yctx.strokeStyle = "rgba(255,255,255,.55)"; yctx.fillStyle = "rgba(0,0,0,.25)";
    yctx.beginPath();
    if (p.sida === "v") yctx.roundRect(p.x0 - 28, p.y0 - STICK_R - 28, 56, 2 * STICK_R + 56, 28);
    else yctx.roundRect(p.x0 - STICK_R - 28, p.y0 - 28, 2 * STICK_R + 56, 56, 28);
    yctx.fill(); yctx.stroke();
    yctx.fillStyle = s.aktiv ? "rgba(255,90,70,.9)" : "rgba(200,200,200,.8)";
    yctx.beginPath(); yctx.arc(p.x0 + dx, p.y0 + dy, 26, 0, 2 * Math.PI); yctx.fill();
  }
  requestAnimationFrame(ritaSpakar);
}
requestAnimationFrame(ritaSpakar);

// ---------- Knappar ----------
function ritaKnappar() {
  const a = $("aktivera");
  a.disabled = !s.driver;
  a.classList.toggle("pa", s.aktiv);
  a.textContent = !s.driver ? "Ej förare" : s.aktiv ? `AKTIV ${s.max.toFixed(2)}` : "AKTIVERA";
  $("ljus").classList.toggle("pa", s.ljus);
  $("vand").classList.toggle("pa", s.pivot);
  $("maxtxt").textContent = "Max " + s.max.toFixed(2);
}
function lasa(varfor) { if (s.aktiv) { s.aktiv = false; skickaStyr(); if (varfor) visa(varfor); } ritaKnappar(); }
$("aktivera").addEventListener("click", () => {
  s.senastTryck = Date.now(); keepAwake();
  if (s.aktiv) { lasa(); return; }
  if (estopText()) { visa("Nödstoppet är intryckt"); return; }
  if (s.gas !== 0 || s.styr !== 0) { visa("Släpp spakarna innan du aktiverar"); return; }
  s.aktiv = true; visa(""); ritaKnappar();
});
$("kugg").addEventListener("click", () => $("installningar").classList.toggle("oppen"));
$("ljus").addEventListener("click", () => { s.ljus = !s.ljus; s.senastTryck = Date.now(); ritaKnappar(); });
function nyMax(d) {
  s.max = clampMax(s.max + d); s.senastTryck = Date.now();
  try { localStorage.setItem("max", String(s.max)); } catch (_) {}
  ritaKnappar();
}
$("maxned").addEventListener("click", () => nyMax(-MAX_STEG));
$("maxupp").addEventListener("click", () => nyMax(+MAX_STEG));
const vand = $("vand");
vand.addEventListener("pointerdown", (e) => { vand.setPointerCapture(e.pointerId); s.pivot = true; s.senastTryck = Date.now(); ritaKnappar(); });
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"])
  vand.addEventListener(ev, () => { s.pivot = false; ritaKnappar(); });
ritaKnappar();

// ---------- Styranslutningen ----------
let ws = null;
function skicka(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function skickaStyr() {
  const kor = s.driver && s.aktiv;
  skicka({ Control: {
    throttle: kor ? s.gas : 0, steering: kor ? s.styr : 0, accessory_a: 0, accessory_b: 0,
    lights: s.ljus, activated: kor, timestamp_ms: Date.now(), max_output: s.max, pivot: kor && s.pivot,
  } });
}
function anslut() {
  ws = new WebSocket("wss://" + location.host + "/ws");
  ws.onopen = () => skicka({ Connect: { as_viewer: false, view_code: null } });
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m === "ConnectedAsDriver") { s.driver = true; visa(""); }
    else if (m === "ConnectedAsViewer") { s.driver = false; }
    else if (m.ConnectDenied) { s.driver = false; visa("Någon annan kör roboten just nu: " + m.ConnectDenied.reason); }
    else if (m.Status) { s.status = m.Status; s.statusAt = Date.now(); if (estopText()) lasa("Nödstopp: " + estopText()); }
    else if (m.Pong) { s.rtt = Date.now() - m.Pong.sent_ms; }
    ritaKnappar();
  };
  ws.onclose = () => {
    s.driver = false; lasa(); ws = null;
    visa("Anslutningen bröts – försöker igen…");
    setTimeout(anslut, 1500);
  };
}
anslut();
setInterval(() => {
  if (s.aktiv && Date.now() - s.senastTryck > IDLE_MS) lasa("Låst efter 5 minuter utan tryck");
  skickaStyr();
}, SEND_MS);
setInterval(() => skicka({ Ping: { sent_ms: Date.now() } }), 1000);

// Skärmen släcks, annan app, samtal: lås och stanna direkt.
function bort() { sticks.clear(); uppdateraSpakar(); lasa("Låst: sidan var inte synlig"); }
document.addEventListener("visibilitychange", () => { if (document.hidden) bort(); else keepAwake(); });
addEventListener("pagehide", bort);
addEventListener("blur", () => { sticks.clear(); uppdateraSpakar(); });

// ---------- Statusraden ----------
// Som hud::estop_text i Robotstyrning.
function estopText() {
  const e = s.status && s.status.estop;
  if (!e || e === "ok") return null;
  if (e === "intryckt") return "intryckt";
  if (e === "sparrad") return "utdraget – släpper spärren…";
  return "knappen går inte att läsa (kabel?)";
}
function f(v, d, enh) { return v == null || !isFinite(v) ? "–" : v.toFixed(d) + enh; }
setInterval(() => {
  const st = s.status, farsk = st && Date.now() - s.statusAt < 3000;
  const rttKlass = s.rtt == null ? "" : s.rtt < 300 ? "ok" : s.rtt < 800 ? "warn" : "bad";
  let h = `<span><b>${!ws || ws.readyState !== 1 ? '<span class="bad">Frånkopplad</span>' : s.driver ? "Förare" : "Tittar"}</b></span>`;
  h += `<span>Svar ${s.rtt == null ? "–" : `<span class="${rttKlass}">${s.rtt} ms</span>`}</span>`;
  if (farsk) {
    h += `<span>${f(st.speed_kmh, 1, " km/h")}</span>`;
    h += `<span>Batt ${f(st.battery_percent, 0, " %")} ${f(st.battery_voltage, 1, " V")}</span>`;
    h += `<span>Styr ${st.steering_deg != null ? f(st.steering_deg, 0, "°") : f(st.steering_percent, 0, " %")}</span>`;
    if (estopText()) h += `<span class="bad"><b>NÖDSTOPP: ${estopText()}</b></span>`;
    if (st.fault_text) h += `<span class="warn">${st.fault_text}</span>`;
  } else if (ws && ws.readyState === 1) h += `<span class="warn">Ingen status från roboten</span>`;
  h += `<span>${s.fps.toFixed(0)} bilder/s</span>`;
  $("status").innerHTML = h;
}, 250);

// Skärmen tänd (Safari kräver ett tryck först).
let wakeLock = null;
async function keepAwake() {
  try { if (!wakeLock && "wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (_) {}
}

// ---------- Färdlinjer och vändsymbol (som client/src/guide.rs) ----------
function styrGrader(st) {
  if (!st) return null;
  let deg = st.steering_deg != null ? st.steering_deg : st.steering_percent != null ? st.steering_percent / 100 * MAX_STEER_DEG : null;
  if (deg == null) return null;
  const pct = st.steering_percent != null ? st.steering_percent : deg / MAX_STEER_DEG * 100;
  return Math.abs(pct) < STRAIGHT_PERCENT || Math.abs(deg) < STRAIGHT_DEG ? 0 : deg;
}
function banPunkt(deg, lat, sm) {
  const k = Math.tan(deg * Math.PI / 180) / WHEELBASE_M;
  if (Math.abs(k) < 1e-4) return [lat, sm];
  const r = 1 / k, rr = r - lat, a = sm * k;
  return [r - rr * Math.cos(a), rr * Math.sin(a)];
}
function proj(W, H, x, z) {
  z += 1.2; if (z < 0.3) return null;
  const fl = W * 0.55, y = H * HORIZON + fl * CAM_HEIGHT / z;
  return y <= H + 40 ? [W / 2 + fl * x / z, y] : null;
}
function ritaLinjer(c, W, H, deg) {
  const k = Math.abs(Math.tan(deg * Math.PI / 180)) / WHEELBASE_M;
  const len = k > 1e-4 ? Math.min(PATH_LEN_M, (Math.PI / 3) / k) : PATH_LEN_M;
  for (const [lat, w, col] of [[-TRACK_M / 2, 7, "rgb(255,60,50)"], [TRACK_M / 2, 7, "rgb(255,60,50)"], [0, 3, "rgba(160,30,25,.63)"]]) {
    c.lineWidth = w; c.strokeStyle = col; c.lineCap = "round"; c.beginPath(); let forst = true;
    for (let i = 0; i <= 40; i++) {
      const [x, z] = banPunkt(deg, lat, len * i / 40), p = proj(W, H, x, z);
      if (!p) continue;
      const dx = lat === 0 ? 0 : Math.sign(lat) * SPREAD_PX;
      if (forst) { c.moveTo(p[0] + dx, p[1]); forst = false; } else c.lineTo(p[0] + dx, p[1]);
    }
    c.stroke();
  }
  c.lineWidth = 3; c.strokeStyle = "rgba(160,30,25,.63)";
  for (const m of [1, 2, 3, 4]) {
    if (m > len) continue;
    const a = banPunkt(deg, -TRACK_M / 2, m), b = banPunkt(deg, TRACK_M / 2, m);
    const pa = proj(W, H, a[0], a[1]), pb = proj(W, H, b[0], b[1]);
    if (pa && pb) { c.beginPath(); c.moveTo(pa[0] - SPREAD_PX, pa[1]); c.lineTo(pb[0] + SPREAD_PX, pb[1]); c.stroke(); }
  }
}
function ritaVand(c, W, H, dir) {
  const cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.14;
  const at = (d) => { const a = d * Math.PI / 180; return [cx + Math.sin(a) * r, cy - Math.cos(a) * r]; };
  c.lineWidth = 9; c.strokeStyle = "rgb(255,60,50)"; c.beginPath();
  for (let i = 0; i <= 60; i++) { const p = at(30 + 300 * i / 60); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
  c.stroke();
  if (dir !== 0) {
    const end = dir > 0 ? 330 : 30, a = end * Math.PI / 180, tip = at(end);
    const t = [Math.cos(a) * Math.sign(dir), Math.sin(a) * Math.sign(dir)], n = [Math.sin(a), -Math.cos(a)];
    const base = [tip[0] - t[0] * 26, tip[1] - t[1] * 26];
    c.fillStyle = "rgb(255,60,50)"; c.beginPath();
    c.moveTo(tip[0] + t[0] * 8, tip[1] + t[1] * 8);
    c.lineTo(base[0] + n[0] * 20, base[1] + n[1] * 20); c.lineTo(base[0] - n[0] * 20, base[1] - n[1] * 20);
    c.fill();
  }
  c.fillStyle = "rgb(255,60,50)"; c.font = `600 ${Math.round(r * 0.28)}px -apple-system, sans-serif`;
  c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("VÄNDNING", cx, cy);
}

// ---------- Video (WebCodecs) ----------
let dekoder = null, behoverNyckel = true, bilder = 0;
setInterval(() => { s.fps = bilder; bilder = 0; }, 1000);
function* nalEnheter(b) {
  let i = 0, start = -1;
  while (i + 3 <= b.length) {
    if (b[i] === 0 && b[i + 1] === 0 && (b[i + 2] === 1 || (b[i + 2] === 0 && b[i + 3] === 1))) {
      const sc = b[i + 2] === 1 ? 3 : 4; if (start >= 0) yield b.subarray(start, i); i += sc; start = i;
    } else i++;
  }
  if (start >= 0) yield b.subarray(start);
}
function kodek(au) {
  for (const n of nalEnheter(au)) if ((n[0] & 0x1f) === 7 && n.length > 3) {
    const h = (x) => x.toString(16).padStart(2, "0"); return "avc1." + h(n[1]) + h(n[2]) + h(n[3]);
  }
  return null;
}
async function nyDekoder(codec) {
  const config = { codec, optimizeForLatency: true };
  try { if (!(await VideoDecoder.isConfigSupported(config)).supported) { visa("Telefonen kan inte avkoda videon"); return false; } }
  catch (e) { visa("Avkodaren: " + e.message); return false; }
  dekoder = new VideoDecoder({
    output: (frame) => {
      if (bild.width !== frame.displayWidth || bild.height !== frame.displayHeight) {
        bild.width = frame.displayWidth; bild.height = frame.displayHeight;
      }
      bctx.drawImage(frame, 0, 0); frame.close(); bilder++;
      const W = bild.width, H = bild.height;
      if (s.pivot && s.aktiv) ritaVand(bctx, W, H, s.styr);
      else { const d = styrGrader(s.status); if (d != null) ritaLinjer(bctx, W, H, d); }
    },
    error: () => { dekoder = null; },
  });
  dekoder.configure(config);
  return true;
}
async function vidBild(buf) {
  const b = new Uint8Array(buf), nyckel = b[0] === 1, au = b.subarray(9);
  const ms = Number(new DataView(buf, 1, 8).getBigUint64(0));
  if (!("VideoDecoder" in window)) return;
  if (!dekoder) { if (!nyckel) return; const c = kodek(au); if (!c || !(await nyDekoder(c))) return; behoverNyckel = true; }
  if (behoverNyckel && !nyckel) return;
  behoverNyckel = false;
  if (dekoder.decodeQueueSize > 3) { behoverNyckel = true; return; }
  try { dekoder.decode(new EncodedVideoChunk({ type: nyckel ? "key" : "delta", timestamp: ms * 1000, data: au })); }
  catch (_) { behoverNyckel = true; }
}
function anslutVideo() {
  const v = new WebSocket("wss://" + location.host + "/video");
  v.binaryType = "arraybuffer";
  v.onmessage = (e) => { if (typeof e.data !== "string") vidBild(e.data); };
  v.onclose = () => { if (dekoder) { try { dekoder.close(); } catch (_) {} dekoder = null; } setTimeout(anslutVideo, 2000); };
}
if (!("VideoDecoder" in window)) visa("Den här webbläsaren kan inte visa video (kräver iOS 16.4 eller senare). Styrningen fungerar ändå.");
anslutVideo();
</script>
</body>
</html>
