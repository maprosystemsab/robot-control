<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robotstyrning</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #e6ece9;
    font: 15px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #diag { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,.65); border-radius: 10px; padding: 8px 12px; font-size: 13px;
    font-variant-numeric: tabular-nums; max-width: calc(100% - 40px); }
  #diag b { font-weight: 600; }
  .ok { color: #5cd38f; } .bad { color: #ff7a6e; } .warn { color: #f2c25a; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 17px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bild"></canvas>
<div id="msg">Ansluter till kameran…</div>
<div id="diag"></div>
<script>
"use strict";
// Steg 1 (2026-10-20): bara kamerabilden, för att se vad telefonen klarar.
const canvas = document.getElementById("bild");
const ctx = canvas.getContext("2d");
const msg = document.getElementById("msg");
const diag = document.getElementById("diag");

const st = { secure: window.isSecureContext, webcodecs: "VideoDecoder" in window,
  codec: "", supported: null, frames: 0, bytes: 0, fps: 0, kbps: 0, delay: null,
  decoded: 0, errors: 0, state: "ansluter", w: 0, h: 0, wake: "nej" };

function show(t) { msg.textContent = t; msg.style.display = t ? "flex" : "none"; }

function render() {
  const yes = (v) => v ? '<span class="ok">ja</span>' : '<span class="bad">nej</span>';
  const delay = st.delay == null ? "–" :
    `<span class="${st.delay < 400 ? "ok" : st.delay < 1000 ? "warn" : "bad"}">${st.delay} ms</span>`;
  diag.innerHTML =
    `<b>Anslutning:</b> ${st.state}<br>` +
    `<b>Säker sida (https):</b> ${yes(st.secure)} &nbsp; <b>WebCodecs:</b> ${yes(st.webcodecs)}<br>` +
    `<b>Kodek:</b> ${st.codec || "–"} ${st.supported == null ? "" : yes(st.supported)}<br>` +
    `<b>Bild:</b> ${st.w}×${st.h}, ${st.fps.toFixed(1)} bilder/s, ${Math.round(st.kbps)} kbit/s<br>` +
    `<b>Fördröjning (ca):</b> ${delay} &nbsp; <b>Fel:</b> ${st.errors}<br>` +
    `<b>Skärmen hålls tänd:</b> ${st.wake}${st.wake.includes("ja") ? "" : " – tryck på skärmen"}`;
}
setInterval(render, 500);

// Mät bilder/s och datamängd varje sekund.
let lastTick = performance.now(), tickFrames = 0, tickBytes = 0;
setInterval(() => {
  const now = performance.now(), dt = (now - lastTick) / 1000;
  st.fps = tickFrames / dt; st.kbps = tickBytes * 8 / dt / 1000;
  tickFrames = 0; tickBytes = 0; lastTick = now;
}, 1000);

// Skärmen tänd (bara på https, iOS 16.4+).
async function keepAwake() {
  try {
    if (!("wakeLock" in navigator)) { st.wake = "stöds inte"; return; }
    const lock = await navigator.wakeLock.request("screen");
    st.wake = '<span class="ok">ja</span>';
    lock.addEventListener("release", () => { st.wake = "nej"; });
  } catch (e) { st.wake = "nej (" + e.name + ")"; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
// Safari ger bara tillstånd efter ett tryck på skärmen (NotAllowedError annars).
document.addEventListener("touchend", () => { if (!st.wake.includes("ja")) keepAwake(); });
document.addEventListener("click", () => { if (!st.wake.includes("ja")) keepAwake(); });
keepAwake();

// H.264 Annex B: hitta NAL-enheterna i en bild.
function* nalUnits(b) {
  let i = 0, start = -1;
  while (i + 3 <= b.length) {
    if (b[i] === 0 && b[i + 1] === 0 && (b[i + 2] === 1 || (b[i + 2] === 0 && b[i + 3] === 1))) {
      const sc = b[i + 2] === 1 ? 3 : 4;
      if (start >= 0) yield b.subarray(start, i);
      i += sc; start = i;
    } else i++;
  }
  if (start >= 0) yield b.subarray(start);
}

// Kodeksträngen (avc1.PPCCLL) ur SPS i första nyckelbilden.
function codecFromSps(au) {
  for (const n of nalUnits(au)) {
    if ((n[0] & 0x1f) === 7 && n.length > 3) {
      const h = (x) => x.toString(16).padStart(2, "0");
      return "avc1." + h(n[1]) + h(n[2]) + h(n[3]);
    }
  }
  return null;
}

let decoder = null;

async function setupDecoder(codec) {
  st.codec = codec;
  const config = { codec, optimizeForLatency: true };
  try {
    const s = await VideoDecoder.isConfigSupported(config);
    st.supported = s.supported;
    if (!s.supported) { show("Telefonen kan inte avkoda videon (" + codec + ")."); return false; }
  } catch (e) { st.supported = false; show("Avkodaren: " + e.message); return false; }
  decoder = new VideoDecoder({
    output: (frame) => {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth; canvas.height = frame.displayHeight;
        st.w = frame.displayWidth; st.h = frame.displayHeight;
      }
      ctx.drawImage(frame, 0, 0);
      st.delay = Math.max(0, Date.now() - Math.round(frame.timestamp / 1000));
      frame.close();
      st.decoded++;
      show("");
    },
    error: (e) => { st.errors++; st.state = "avkodningsfel: " + e.message; decoder = null; },
  });
  decoder.configure(config);
  return true;
}

let needKey = true;

async function onFrame(buf) {
  const b = new Uint8Array(buf);
  const key = b[0] === 1;
  const ms = Number(new DataView(buf, 1, 8).getBigUint64(0));
  const au = b.subarray(9);
  tickFrames++; tickBytes += b.length;
  if (!st.webcodecs) return;
  if (!decoder) {
    if (!key) return;
    const codec = codecFromSps(au);
    if (!codec || !(await setupDecoder(codec))) return;
    needKey = true;
  }
  if (needKey && !key) return;
  needKey = false;
  // Hinner telefonen inte avkoda: släpp bilder fram till nästa nyckelbild.
  if (decoder.decodeQueueSize > 3) { needKey = true; return; }
  try {
    decoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: ms * 1000, data: au }));
  } catch (e) { st.errors++; needKey = true; }
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/video");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { st.state = '<span class="ok">ansluten</span>'; if (!st.webcodecs)
    show(st.secure ? "Webbläsaren saknar WebCodecs (kräver iOS 16.4 eller senare)."
                   : "Sidan måste öppnas med https:// för att visa video."); else show("Väntar på kamerabild…"); };
  ws.onmessage = (e) => { if (typeof e.data === "string") show(e.data); else onFrame(e.data); };
  ws.onclose = () => {
    st.state = '<span class="bad">frånkopplad</span>, försöker igen';
    if (decoder) { try { decoder.close(); } catch (_) {} decoder = null; }
    setTimeout(connect, 2000);
  };
}
connect();
render();
</script>
</body>
</html>
