[package]
name = "robotstyrning"
edition.workspace = true
version.workspace = true
build = "build.rs"       # versionen (commit-tiden) och Windows-ikonen

# Programmet heter SentinAnt Lite sedan 2026-11-27. Paketet och programfilen från cargo
# heter fortfarande robotstyrning; den installeras som sentinant-lite (scripts/).

[features]
# BARA FÖR PROV: godkänner uppdateringslistor signerade med provnyckeln. Aldrig i ett
# program som delas ut (se robotuppdatering/Cargo.toml).
provnyckel = ["robotuppdatering/provnyckel"]

[dependencies]
relay-protocol = { path = "../relay-protocol" }
robotuppdatering = { path = "../robotuppdatering", features = ["kontroll"] }  # uppdateringslistan: signatur, löpnummer, SHA-256
eframe = "0.27"
egui = "0.27"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
tracing = "0.1"
gilrs = "0.10"           # PS4-kontroll (Bluetooth + kabel)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"        # var vi sparar "tidigare anslutna robotar"
openh264 = "0.9.8"
# Kartan i LOS-läge: hämta kartbilder (https) och avkoda dem.
ureq = "2"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }  # uppdateringslistans datum

[dev-dependencies]
ring = "0.17"            # testerna signerar provlistor (ed25519)
